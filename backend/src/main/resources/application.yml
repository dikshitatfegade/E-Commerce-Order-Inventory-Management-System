server:
  port: 8080

spring:
  application:
    name: ecommerce-oms
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/oms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-change-this-secret-32+bytes}"
    expiration-ms: 86400000
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
